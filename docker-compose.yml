services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: content_intelligence
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content_intelligence"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - content-intelligence-pg:/var/lib/postgresql/data

volumes:
  content-intelligence-pg:
